<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>등산 지도 — 전국 명산 & GPS 기록</title>
<!-- 카카오맵 SDK: 아래 JS 상수 KAKAO_APP_KEY에 본인의 JavaScript 키를 입력하면 이 태그가 자동으로 SDK를 불러옵니다 -->
<script id="kakao-sdk-loader"></script>
<style>
/* ===== 기본 ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f5f6f5;color:#212121;font-size:15px}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.tabpage{flex:1;position:relative;display:none;overflow:hidden;background:#f5f6f5}
.tabpage.active{display:block}

/* ===== 하단 탭바 ===== */
#tabbar{height:62px;flex:0 0 62px;background:#fff;border-top:1px solid #e0e0e0;display:flex;z-index:2000}
#tabbar button{flex:1;border:0;background:none;font-size:12px;color:#757575;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px}
#tabbar button .ic{font-size:21px;line-height:1}
#tabbar button.active{color:#2e7d32;font-weight:700}

/* ===== 지도 탭 ===== */
#map{position:absolute;inset:0;z-index:0}
/* 카카오 우상단 지도타입 컨트롤이 검색창과 겹치지 않도록 오른쪽 여백 확보 */
#searchWrap{margin-right:78px}
/* 카카오 앱키 안내 배너 */
#sdkBanner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1500;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:26px 24px;max-width:86%;text-align:center}
#sdkBanner .sb-t{font-size:17px;font-weight:800;margin-bottom:10px}
#sdkBanner .sb-d{font-size:14px;color:#616161;line-height:1.7}
#sdkBanner .sb-d b{color:#2e7d32}

/* 상단 오버레이 */
#topbar{position:absolute;top:0;left:0;right:0;z-index:1000;padding:10px 12px 0;pointer-events:none}
#topbar>*{pointer-events:auto}
#searchWrap{position:relative}
#searchInput{width:100%;height:46px;border:0;border-radius:23px;padding:0 18px;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.18);outline:none;background:#fff}
#searchDrop{position:absolute;top:52px;left:0;right:0;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);overflow:hidden;max-height:300px;overflow-y:auto}
.sr-item{padding:11px 16px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;min-height:48px}
.sr-item:last-child{border-bottom:0}
.sr-item .n{font-weight:600}
.sr-item .r{font-size:12px;color:#757575;margin-left:6px}
.sr-item .h{font-size:12px;color:#2e7d32;font-weight:600;white-space:nowrap}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;border:1px solid #d7d7d7;background:#fff;font-size:13px;color:#424242;white-space:nowrap}
.chip.active{background:#2e7d32;border-color:#2e7d32;color:#fff;font-weight:600}
.chip.picked{background:#e8f5e9;border-color:#2e7d32;color:#2e7d32;font-weight:600}
.dropPanel{position:absolute;top:112px;left:12px;right:12px;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:10px;z-index:1001;max-height:260px;overflow-y:auto}
.dropPanel .opt{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;font-size:14px;border-radius:8px;min-height:44px}
.dropPanel .opt:active{background:#e8f5e9}
.dropPanel .opt.sel{color:#2e7d32;font-weight:700}
.dropPanel .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dropPanel .grid .opt{text-align:center;border:1px solid #e0e0e0}

/* 내 위치 버튼 */
#locateBtn{position:absolute;top:118px;right:12px;z-index:1000;width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:20px;color:#2e7d32}

/* GPS 플로팅 */
#trackFab{position:absolute;right:14px;bottom:170px;z-index:1000;border:0;background:#2e7d32;color:#fff;font-size:15px;font-weight:700;border-radius:999px;padding:14px 20px;box-shadow:0 4px 14px rgba(46,125,50,.45)}
#trackBar{position:absolute;top:118px;left:12px;right:70px;z-index:1000;background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:10px 12px}
#trackBar .stats{display:flex;gap:14px;margin-bottom:8px}
#trackBar .stat .v{font-size:17px;font-weight:800;color:#1b5e20}
#trackBar .stat .l{font-size:11px;color:#757575}
#trackBar .tbtns{display:flex;gap:8px}
.tbtn{flex:1;border:0;border-radius:10px;padding:11px 0;font-size:14px;font-weight:700;min-height:44px}
.tbtn.pause{background:#fff3e0;color:#e65100}
.tbtn.end{background:#2e7d32;color:#fff}

/* 산 마커는 카카오 MarkerImage(SVG 뱃지)로 렌더링 — CSS 불필요 */
.me-dot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25),0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%)}

/* 바텀시트 */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:72%;transition:height .18s ease;touch-action:none}
#sheet.collapsed{height:64px}
#sheet.expanded{height:72%}
#sheetHandle{padding:8px 0 2px;display:flex;justify-content:center;flex:0 0 auto;cursor:grab}
#sheetHandle span{width:44px;height:5px;border-radius:3px;background:#cfcfcf}
#sheetSummary{flex:0 0 auto;padding:2px 18px 10px;font-size:14px;font-weight:600;color:#424242;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#sheetSummary .sub{font-weight:400;color:#757575;font-size:12px;margin-left:6px}
#sheetBody{flex:1;overflow-y:auto;padding:4px 14px 20px;display:none}
#sheet.expanded #sheetBody{display:block}

/* 산 카드 */
.mcard{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.mcard:active{background:#f9f9f9}
.mcard .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mcard .nm{font-size:16px;font-weight:800}
.mcard .hg{font-size:13px;color:#2e7d32;font-weight:700;white-space:nowrap}
.mcard .rg{font-size:13px;color:#757575;margin-top:3px}
.mcard .ds{font-size:13px;color:#616161;margin-top:7px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bdg{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px}
.bdg.top100{background:#e8f5e9;color:#2e7d32}
.bdg.np{background:#1b5e20;color:#fff}
.bdg.done{background:#fff3e0;color:#e65100}
.bdg.season{background:#e3f2fd;color:#1565c0}
.diffbar{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.diffbar i{width:14px;height:6px;border-radius:3px;background:#e0e0e0}
.diffbar i.on{background:#2e7d32}

/* 상세 */
#detailBack{border:0;background:none;color:#2e7d32;font-size:14px;font-weight:700;padding:10px 4px;min-height:44px}
.d-title{font-size:21px;font-weight:800;margin:2px 0 4px}
.d-meta{font-size:14px;color:#616161;line-height:1.7}
.d-desc{font-size:14px;line-height:1.7;color:#424242;margin:12px 0;background:#fafafa;border-radius:12px;padding:12px}
.d-btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:12px;padding:14px 0;font-size:15px;font-weight:700;min-height:50px}
.btn.primary{background:#2e7d32;color:#fff}
.btn.ghost{background:#fff;color:#2e7d32;border:1.5px solid #2e7d32}
.btn.warn{background:#fff;color:#c62828;border:1.5px solid #c62828}
.btn.done-on{background:#ffa000;color:#fff}

/* 발견 탭 */
.page{height:100%;overflow-y:auto;padding:16px 14px 24px}
.sec-title{font-size:18px;font-weight:800;margin:6px 2px 12px}
.rec-box{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:20px}
.rec-row{margin-bottom:12px}
.rec-row label{display:block;font-size:13px;color:#616161;margin-bottom:6px;font-weight:600}
.rec-row select{width:100%;height:48px;border:1px solid #d5d5d5;border-radius:12px;font-size:15px;padding:0 12px;background:#fff;font-family:inherit}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0 2px;font-size:14px;font-weight:600}
.switch{position:relative;width:52px;height:30px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;z-index:2}
.sw-ui{position:absolute;inset:0;background:#cfcfcf;border-radius:15px;transition:.15s}
.sw-ui:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.sw-ui{background:#2e7d32}
.switch input:checked+.sw-ui:after{left:25px}
.big-card{background:linear-gradient(135deg,#2e7d32,#66bb6a);border-radius:16px;color:#fff;padding:22px 18px;margin-top:14px;box-shadow:0 4px 14px rgba(46,125,50,.35)}
.big-card .bn{font-size:24px;font-weight:800}
.big-card .bi{font-size:14px;opacity:.92;margin-top:6px;line-height:1.6}
.big-card .btn{margin-top:14px;background:#fff;color:#2e7d32}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hcard{flex:0 0 158px;background:#fff;border-radius:12px;padding:13px;border:1px solid #e8e8e8;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hcard .n{font-weight:800;font-size:14px}
.hcard .h{font-size:12px;color:#2e7d32;font-weight:700;margin-top:2px}
.hcard .r{font-size:12px;color:#757575;margin-top:2px}
.prog{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:20px}
.prog .pt{font-size:14px;font-weight:700;margin-bottom:8px}
.prog .bar{height:10px;border-radius:5px;background:#e0e0e0;overflow:hidden}
.prog .bar i{display:block;height:100%;background:#2e7d32;border-radius:5px}

/* 기록 탭 */
#recordTop{padding:16px 14px 6px}
.rec-card{background:#fff;border-radius:12px;padding:14px;margin:0 14px 10px;border:1px solid #e8e8e8;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.rec-card .rn{font-weight:800;font-size:15px}
.rec-card .rd{font-size:12px;color:#757575;margin-top:2px}
.rec-card .rs{display:flex;gap:14px;margin-top:8px;font-size:13px}
.rec-card .rs b{color:#1b5e20}
.rec-card .rb{display:flex;gap:8px;margin-top:10px}
.sbtn{flex:1;border:1px solid #d5d5d5;background:#fff;border-radius:10px;padding:10px 0;font-size:13px;font-weight:600;min-height:42px}
.sbtn.del{color:#c62828;border-color:#ef9a9a}
.empty{padding:40px 20px;text-align:center;color:#9e9e9e;font-size:14px;line-height:1.7}

/* 저장 모달 */
#saveModal{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#saveBox{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px 26px}
#saveBox h3{margin:0 0 14px;font-size:18px}
#saveBox label{display:block;font-size:13px;font-weight:600;color:#616161;margin:12px 0 6px}
#saveBox input[type=text],#saveBox select,#saveBox textarea{width:100%;border:1px solid #d5d5d5;border-radius:12px;padding:12px;font-size:15px;font-family:inherit}
#saveBox textarea{height:80px;resize:none}
#saveBox .row{display:flex;gap:10px;margin-top:18px}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:4000;background:#323232;color:#fff;border-radius:999px;padding:12px 20px;font-size:14px;max-width:88%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
@media(min-width:700px){.hcard{flex-basis:180px}}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 지도 탭 ============ -->
  <section id="tab-map" class="tabpage active">
    <div id="map"></div>
    <div id="sdkBanner" class="hidden">
      <div class="sb-t">🗺 카카오 앱키를 입력해주세요</div>
      <div class="sb-d">developers.kakao.com에서 JavaScript 키를 발급받아<br>파일 상단의 <b>KAKAO_APP_KEY</b>에 입력하세요.</div>
    </div>
    <div id="topbar">
      <div id="searchWrap">
        <input id="searchInput" type="text" placeholder="산 이름 검색 (예: 지리산)" autocomplete="off">
        <div id="searchDrop" class="hidden"></div>
      </div>
      <div id="chips">
        <button class="chip active" data-cat="all">전체</button>
        <button class="chip" data-cat="top100">100대명산</button>
        <button class="chip" data-cat="np">국립공원</button>
        <button class="chip" data-cat="easy">초보추천</button>
        <button class="chip" id="chipRegion">지역 ▾</button>
        <button class="chip" id="chipSeason">계절 ▾</button>
      </div>
      <div id="regionPanel" class="dropPanel hidden"><div id="regionOpts"></div></div>
      <div id="seasonPanel" class="dropPanel hidden"><div class="grid" id="seasonOpts"></div></div>
    </div>
    <button id="locateBtn" title="내 위치">◎</button>
    <button id="trackFab">🥾 등산 시작</button>
    <div id="trackBar" class="hidden">
      <div class="stats">
        <div class="stat"><div class="v" id="stTime">00:00</div><div class="l">경과시간</div></div>
        <div class="stat"><div class="v" id="stDist">0m</div><div class="l">이동거리</div></div>
        <div class="stat"><div class="v" id="stGain">0m</div><div class="l">누적 상승</div></div>
      </div>
      <div class="tbtns">
        <button class="tbtn pause" id="btnPause">일시정지</button>
        <button class="tbtn end" id="btnEnd">종료</button>
      </div>
    </div>
    <div id="sheet" class="collapsed">
      <div id="sheetHandle"><span></span></div>
      <div id="sheetSummary"></div>
      <div id="sheetBody"></div>
    </div>
  </section>

  <!-- ============ 발견 탭 ============ -->
  <section id="tab-discover" class="tabpage">
    <div class="page">
      <div class="prog">
        <div class="pt" id="progText">100대명산 중 0곳 등정</div>
        <div class="bar"><i id="progBar" style="width:0%"></i></div>
      </div>
      <div class="sec-title">이번 주말, 어디로 갈까요?</div>
      <div class="rec-box">
        <div class="rec-row"><label>지역</label><select id="recRegion"></select></div>
        <div class="rec-row"><label>난이도</label><select id="recDiff">
          <option value="">전체</option><option value="easy">쉬움 (1~2)</option>
          <option value="mid">보통 (3)</option><option value="hard">어려움 (4~5)</option>
        </select></div>
        <div class="toggle-row"><span>아직 안 가본 산만</span>
          <span class="switch"><input type="checkbox" id="recUnvisited" checked><span class="sw-ui"></span></span>
        </div>
        <button class="btn primary" id="btnRecommend" style="margin-top:12px">추천받기</button>
        <div id="recResult"></div>
      </div>
      <div class="sec-title" id="seasonTitle">지금 계절 추천</div>
      <div class="hscroll" id="seasonCards"></div>
    </div>
  </section>

  <!-- ============ 기록 탭 ============ -->
  <section id="tab-record" class="tabpage">
    <div class="page" style="padding-bottom:8px">
      <div class="sec-title">등산 기록</div>
      <div class="rec-box" id="recordCtlBox">
        <div id="recordIdle">
          <div style="font-size:14px;color:#616161;line-height:1.7;margin-bottom:12px">GPS로 이동 경로를 추적하고<br>거리·시간·상승고도를 기록하세요.</div>
          <button class="btn primary" id="btnStart2">🥾 등산 시작</button>
        </div>
        <div id="recordActive" class="hidden">
          <div class="stats" style="display:flex;gap:16px;margin-bottom:10px">
            <div class="stat"><div class="v" id="stTime2" style="font-size:18px;font-weight:800;color:#1b5e20">00:00</div><div class="l" style="font-size:11px;color:#757575">경과시간</div></div>
            <div class="stat"><div class="v" id="stDist2" style="font-size:18px;font-weight:800;color:#1b5e20">0m</div><div class="l" style="font-size:11px;color:#757575">이동거리</div></div>
            <div class="stat"><div class="v" id="stGain2" style="font-size:18px;font-weight:800;color:#1b5e20">0m</div><div class="l" style="font-size:11px;color:#757575">누적 상승</div></div>
          </div>
          <div class="tbtns" style="display:flex;gap:8px">
            <button class="tbtn pause" id="btnPause2">일시정지</button>
            <button class="tbtn end" id="btnEnd2">종료</button>
          </div>
        </div>
      </div>
      <div id="recordList"></div>
    </div>
  </section>

  <nav id="tabbar">
    <button data-tab="map" class="active"><span class="ic">🗺</span>지도</button>
    <button data-tab="discover"><span class="ic">✨</span>발견</button>
    <button data-tab="record"><span class="ic">📍</span>기록</button>
  </nav>
</div>

<!-- 저장 다이얼로그 -->
<div id="saveModal" class="hidden">
  <div id="saveBox">
    <h3>등산 기록 저장</h3>
    <div style="font-size:13px;color:#616161" id="saveSummary"></div>
    <label>이름</label><input type="text" id="saveName">
    <label>산 태그 (선택하면 자동 등정 처리)</label><select id="saveMountain"></select>
    <label>메모</label><textarea id="saveMemo" placeholder="오늘 등산은 어땠나요?"></textarea>
    <div class="row">
      <button class="btn ghost" id="btnDiscard">버리기</button>
      <button class="btn primary" id="btnSave">저장</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
"use strict";
// ★★★ 카카오 앱키 입력 (https://developers.kakao.com → 내 애플리케이션 → JavaScript 키)

/* ===== 유틸 ===== */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add("hidden"),2400);}
// 하버사인 거리 (m)
function hav(a,b,c,d){const R=6371000,t=Math.PI/180;
  const s1=Math.sin((c-a)/2*t),s2=Math.sin((d-b)/2*t);
  return 2*R*Math.asin(Math.sqrt(s1*s1+Math.cos(a*t)*Math.cos(c*t)*s2*s2));}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1)+"km":Math.round(m)+"m";}
function fmtDur(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  if(h>0)return h+"시간 "+m+"분";if(m>0)return m+"분 "+(s%60)+"초";return s+"초";}
function fmtClock(s){s=Math.floor(s);const h=String(Math.floor(s/3600)).padStart(2,"0"),m=String(Math.floor(s%3600/60)).padStart(2,"0"),ss=String(s%60).padStart(2,"0");return h+":"+m+":"+ss;}
function fmtDate(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function curSeason(){const m=new Date().getMonth()+1; // 0=1월
  if(m>=3&&m<=5)return"봄";if(m>=6&&m<=8)return"여름";if(m>=9&&m<=11)return"가을";return"겨울";}

function mountainSidos(m){return m.region.split(",").map(r=>r.trim());}
function allSidos(){const s=new Set();MOUNTAINS.forEach(m=>mountainSidos(m).forEach(x=>s.add(x)));
  return SIDO_ORDER.filter(x=>s.has(x)).concat([...s].filter(x=>!SIDO_ORDER.includes(x)));}

/* ===== 지도 (카카오맵 SDK) ===== */
let map=null, mapReady=false, clusterer=null;
let markers=[]; // {m, marker}
// SVG 산 뱃지 → 카카오 MarkerImage
function badgeImage(m){
  const done=isSummited(m.name);
  const lvl=mapReady?map.getLevel():13;
  const raw=lvl<=10?Math.round(m.height)+"m":m.name; // 줌인(레벨↓)일수록 표고, 줌아웃이면 산 이름
  const label=String(raw).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const bg=done?"#ffa000":(m.national_park?"#1b5e20":"#43a047");
  const bd=done?"#e65100":(m.national_park?"#0d3b12":"#ffffff");
  let w=20;
  for(const ch of String(raw)){w+=/[가-힣]/.test(ch)?13:7;}
  if(done)w+=16;
  const h=30;
  let inner='<rect x="1" y="1" width="'+(w-2)+'" height="'+(h-2)+'" rx="14" fill="'+bg+'" stroke="'+bd+'" stroke-width="2"/>'
    +'<text x="'+(w/2)+'" y="19.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff" font-family="sans-serif">'+label+'</text>';
  if(done){
    inner+='<circle cx="'+(w-7)+'" cy="7" r="8" fill="#ffa000" stroke="#ffffff" stroke-width="2"/>'
      +'<text x="'+(w-7)+'" y="10.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" font-family="sans-serif">✓</text>';
  }
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+inner+'</svg>';
  return new kakao.maps.MarkerImage(
    "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg),
    new kakao.maps.Size(w,h),
    {offset:new kakao.maps.Point(w/2,h/2)}
  );
}
const CLUSTER_STYLES=[
  {width:"46px",height:"46px",background:"rgba(67,160,71,.92)",borderRadius:"50%",color:"#fff",textAlign:"center",lineHeight:"46px",fontSize:"14px",fontWeight:"bold",border:"2px solid #fff",boxShadow:"0 2px 8px rgba(0,0,0,.3)",boxSizing:"border-box"},
  {width:"56px",height:"56px",background:"rgba(46,125,50,.92)",borderRadius:"50%",color:"#fff",textAlign:"center",lineHeight:"56px",fontSize:"15px",fontWeight:"bold",border:"2px solid #fff",boxShadow:"0 2px 8px rgba(0,0,0,.3)",boxSizing:"border-box"},
  {width:"68px",height:"68px",background:"rgba(27,94,32,.94)",borderRadius:"50%",color:"#fff",textAlign:"center",lineHeight:"68px",fontSize:"16px",fontWeight:"bold",border:"2px solid #fff",boxShadow:"0 2px 8px rgba(0,0,0,.3)",boxSizing:"border-box"}
];
function buildMarkers(){
  if(!mapReady)return;
  clusterer.clear();markers=[];
  filtered.forEach(m=>{
    const mk=new kakao.maps.Marker({position:new kakao.maps.LatLng(m.lat,m.lng),image:badgeImage(m),title:m.name,clickable:true});
    kakao.maps.event.addListener(mk,"click",()=>openDetail(m));
    markers.push({m:m,marker:mk});
  });
  clusterer.addMarkers(markers.map(o=>o.marker));
}
function initMap(){
  map=new kakao.maps.Map($("#map"),{center:new kakao.maps.LatLng(36.35,127.9),level:13});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  map.addControl(new kakao.maps.MapTypeControl(),kakao.maps.ControlPosition.TOPRIGHT);
  clusterer=new kakao.maps.MarkerClusterer({map:map,averageCenter:true,minLevel:8,calculator:[10,30,50],styles:CLUSTER_STYLES});
  kakao.maps.event.addListener(map,"zoom_changed",()=>{
    markers.forEach(o=>o.marker.setImage(badgeImage(o.m)));
  });
  mapReady=true;
  $("#sdkBanner").classList.add("hidden");
  buildMarkers();
}
// SDK 로드 실패 또는 앱키 미입력 시 지도 탭에 안내 배너만 표시 (다른 탭은 정상 동작)
function showSdkError(){$("#sdkBanner").classList.remove("hidden");}
(function loadKakaoSdk(){
  if(!KAKAO_APP_KEY||KAKAO_APP_KEY.indexOf("여기에")==0){showSdkError();return;}
  const s=document.getElementById("kakao-sdk-loader");
  s.src="https://dapi.kakao.com/v2/maps/sdk.js?appkey="+KAKAO_APP_KEY+"&libraries=clusterer&autoload=false";
  s.onload=()=>{try{kakao.maps.load(initMap);}catch(e){showSdkError();}};
  s.onerror=()=>{showSdkError();};
})();

/* 내 위치 */
let meOverlay=null;
$("#locateBtn").addEventListener("click",()=>{
  if(!mapReady){toast("지도를 사용하려면 카카오 앱키를 먼저 입력해주세요.");return;}
  if(!navigator.geolocation){toast("이 기기에서 위치 기능을 사용할 수 없어요.");return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const pos=new kakao.maps.LatLng(p.coords.latitude,p.coords.longitude);
    if(meOverlay)meOverlay.setMap(null);
    meOverlay=new kakao.maps.CustomOverlay({position:pos,content:'<div class="me-dot"></div>',xAnchor:0.5,yAnchor:0.5});
    meOverlay.setMap(map);
    map.panTo(pos);
  },()=>{toast("위치를 가져오지 못했어요. HTTPS(배포) 환경에서 위치 권한을 허용해 주세요.");},{enableHighAccuracy:true,timeout:8000});
});

/* ===== 필터 + 검색 ===== */
const filters={cat:"all",region:"",season:""};
let filtered=MOUNTAINS.slice();
function applyFilters(){
  filtered=MOUNTAINS.filter(m=>{
    if(filters.cat==="top100"&&!m.top100)return false;
    if(filters.cat==="np"&&!m.national_park)return false;
    if(filters.cat==="easy"&&m.difficulty>2)return false;
    if(filters.region&&!mountainSidos(m).includes(filters.region))return false;
    if(filters.season&&!m.season.includes(filters.season))return false;
    return true;
  });

(function(){let y0=0,h0=0,drag=false;
  const start=e=>{drag=true;y0=e.touches?e.touches[0].clientY:e.clientY;h0=sheet.offsetHeight;sheet.style.transition="none";};
  const move=e=>{if(!drag)return;const y=e.touches?e.touches[0].clientY:e.clientY;
    const nh=Math.min(window.innerHeight*.72,Math.max(64,h0+(y0-y)));

    if(Math.abs(y0-y)>12){suppressSheetClick=true;setTimeout(()=>suppressSheetClick=false,80);}
    setSheet(y0-y>60||(sheet.classList.contains("collapsed")&&y0-y>-30));};
  ["#sheetHandle","#sheetSummary"].forEach(s=>{const el=$(s);
    el.addEventListener("touchstart",start,{passive:true});el.addEventListener("touchmove",move,{passive:true});el.addEventListener("touchend",end);
    el.addEventListener("mousedown",start);window.addEventListener("mousemove",move);window.addEventListener("mouseup",end);});
})();

/* ===== GPS 추적 ===== */
const tr={watchId:null,points:[],dist:0,gain:0,last:null,activeMs:0,segStart:0,tick:null,line:null,dot:null,mountain:null,paused:false};
function trackUIVisible(on){
  $("#trackFab").classList.toggle("hidden",on);
  $("#trackBar").classList.toggle("hidden",!on);
  $("#recordIdle").classList.toggle("hidden",on);
  $("#recordActive").classList.toggle("hidden",!on);
}
function startTracking(mountainName){
  if(tr.watchId!==null){toast("이미 기록 중이에요.");return;}
  if(!mapReady){toast("지도를 사용하려면 카카오 앱키를 먼저 입력해주세요.");return;}
  if(!("geolocation" in navigator)){toast("이 기기/브라우저는 GPS를 지원하지 않아요.");return;}
  if(location.protocol==="file:"){toast("file:// 환경에서는 GPS가 동작하지 않을 수 있어요. 배포(HTTPS) 환경에서 사용해 주세요.");}
  tr.points=[];tr.dist=0;tr.gain=0;tr.last=null;tr.activeMs=0;tr.segStart=Date.now();tr.mountain=mountainName||null;tr.paused=false;
  tr.watchId=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,timeout:12000,maximumAge:0});
  if(tr.line){tr.line.setMap(null);tr.line=null;}
  if(tr.dot){tr.dot.setMap(null);tr.dot=null;}
  tr.line=new kakao.maps.Polyline({path:[],strokeWeight:5,strokeColor:"#e53935",strokeOpacity:.9});
  tr.line.setMap(map);
  trackUIVisible(true);updateStats();
  tr.tick=setInterval(updateStats,1000);
  toast("GPS 기록을 시작합니다"+(mountainName?" · "+mountainName:""));
  switchTab("map");
}
function onPos(p){
  const c=p.coords;
  if(c.accuracy!=null&&c.accuracy>50)return; // 정확도 낮은 포인트 버림
  const lat=c.latitude,lng=c.longitude,alt=(c.altitude==null?null:c.altitude),t=p.timeStamp||Date.now();
  if(tr.last){const d=hav(tr.last[0],tr.last[1],lat,lng);if(d<5&&!tr.paused){moveDot(lat,lng);return;}} // 5m 미만 이동 무시
  if(tr.paused){moveDot(lat,lng);return;}
  if(tr.last){tr.dist+=hav(tr.last[0],tr.last[1],lat,lng);
    if(alt!=null&&tr.last[2]!=null&&alt>tr.last[2])tr.gain+=alt-tr.last[2];}
  tr.last=[lat,lng,alt];tr.points.push([lat,lng,alt,t]);
  if(tr.line){const path=tr.line.getPath();path.push(new kakao.maps.LatLng(lat,lng));tr.line.setPath(path);}
  moveDot(lat,lng);
  if(tr.points.length===1){map.setCenter(new kakao.maps.LatLng(lat,lng));map.setLevel(3);}
  updateStats();
}
function moveDot(lat,lng){
  const pos=new kakao.maps.LatLng(lat,lng);
  if(tr.dot)tr.dot.setPosition(pos);
  else{tr.dot=new kakao.maps.CustomOverlay({position:pos,content:'<div class="me-dot"></div>',xAnchor:0.5,yAnchor:0.5});tr.dot.setMap(map);}
}
function onPosErr(e){
  let m="GPS 오류가 발생했어요.";
  if(e&&e.code===1)m="위치 권한이 거부됐어요. 브라우저 설정에서 위치 권한을 허용해 주세요.";
  if(e&&e.code===3)m="GPS 신호를 찾지 못했어요. 하늘이 보이는 곳에서 다시 시도해 주세요.";
  if(location.protocol!=="https:"&&location.protocol!=="http:")m+=" file:// 환경에서는 GPS가 제한됩니다. HTTPS(배포) 환경에서 사용해 주세요.";
  toast(m);
}
function updateStats(){
  const el=tr.activeMs+(tr.watchId!==null&&!tr.paused?Date.now()-tr.segStart:0);
  const c=fmtClock(el/1000),d=fmtDist(tr.dist),g=Math.round(tr.gain)+"m";
  $("#stTime").textContent=c;$("#stDist").textContent=d;$("#stGain").textContent=g;
  $("#stTime2").textContent=c;$("#stDist2").textContent=d;$("#stGain2").textContent=g;
}
function togglePause(){
  if(tr.watchId===null)return;
  if(tr.paused){tr.paused=false;tr.segStart=Date.now();$("#btnPause").textContent="일시정지";$("#btnPause2").textContent="일시정지";toast("기록을 재개합니다.");}
  else{tr.paused=true;tr.activeMs+=Date.now()-tr.segStart;$("#btnPause").textContent="재개";$("#btnPause2").textContent="재개";toast("일시정지됐어요.");}
  updateStats();
}
function endTracking(){
  if(tr.watchId===null)return;
  navigator.geolocation.clearWatch(tr.watchId);tr.watchId=null;
  clearInterval(tr.tick);
  if(tr.paused){/* 이미 activeMs 반영됨 */}else{tr.activeMs+=Date.now()-tr.segStart;}
  updateStats();trackUIVisible(false);
  if(tr.points.length<2){toast("기록된 경로가 너무 짧아 저장하지 않았어요.");cleanupTrack();return;}
  openSaveDialog();
}
function cleanupTrack(){if(tr.line){tr.line.setMap(null);tr.line=null;}if(tr.dot){tr.dot.setMap(null);tr.dot=null;}tr.points=[];tr.mountain=null;}
$("#trackFab").addEventListener("click",()=>startTracking(null));

let recordLine=null;
function viewRecord(r){
  switchTab("map");
  if(!mapReady){toast("지도를 사용하려면 카카오 앱키를 먼저 입력해주세요.");return;}
  if(recordLine){recordLine.setMap(null);recordLine=null;}
  const path=r.points.map(p=>new kakao.maps.LatLng(p[0],p[1]));
  recordLine=new kakao.maps.Polyline({path:path,strokeWeight:5,strokeColor:"#e53935",strokeOpacity:.9});
  recordLine.setMap(map);
  const bounds=new kakao.maps.LatLngBounds();
  path.forEach(pt=>bounds.extend(pt));
  map.setBounds(bounds);
  sheetMode="record";selRecord=r;updateSummary();
  $("#sheetBody").innerHTML=
    '<div class="d-title">📍 '+esc(r.name)+'</div>'
    +'<div class="d-meta">'+fmtDate(r.date)+(r.mountain?'<br>산: '+esc(r.mountain):"")+'<br>거리 '+fmtDist(r.distance)+' · 시간 '+fmtDur(r.duration)+' · 상승 '+r.gain+'m</div>'
    +(r.memo?'<div class="d-desc">'+esc(r.memo)+'</div>':"")
    +'<div class="d-btns"><button class="btn ghost" id="recGpx">GPX 저장</button><button class="btn warn" id="recDel">삭제</button></div>';
  $("#recGpx").addEventListener("click",()=>downloadGPX(r));
  $("#recDel").addEventListener("click",()=>{if(confirm("이 기록을 삭제할까요?")){
    records=records.filter(x=>x.id!==r.id);saveRecords();renderRecords();
    if(recordLine){recordLine.setMap(null);recordLine=null;}renderSheetList();toast("기록을 삭제했어요.");}});
  setSheet(true);
}
function downloadGPX(r){
  const escXml=s=>String(s).replace(/[<>&'"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","'":"&apos;",'"':"&quot;"}[c]));
  let s='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="hiking-map" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>'+escXml(r.name)+'</name><trkseg>\n';
  r.points.forEach(p=>{s+='<trkpt lat="'+p[0].toFixed(6)+'" lon="'+p[1].toFixed(6)+'">';
    if(p[2]!=null)s+='<ele>'+p[2].toFixed(1)+'</ele>';
    s+='<time>'+new Date(p[3]).toISOString()+'</time></trkpt>\n';});
  s+='</trkseg></trk>\n</gpx>';
  const d=new Date(r.date),p2=n=>String(n).padStart(2,"0");
  const fn="등산기록_"+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"_"+p2(d.getHours())+p2(d.getMinutes())+".gpx";
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([s],{type:"application/gpx+xml"}));
  a.download=fn;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast("GPX 파일을 저장했어요.");
}

buildRegionPanel();
applyFilters();
renderProgress();
